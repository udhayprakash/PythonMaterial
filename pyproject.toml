[tool.poetry]
name = "pythonmaterial"
version = "0.1.0"
description = "Python Learning Material"
authors = ["udhay Prakash <uday3prakash@gmail.com>"]
readme = "README.md"
package-mode = false


[tool.poetry.dependencies]
python = "^3.12"
pytest = ">=9.2.0,<10.0.0"
requests = "^2.34.2"
jupyter = "^1.1.1"
ipython = "^9.19.1"


[tool.poetry.group.dev.dependencies]
nbconvert = {extras = ["webpdf"], version = "^7.17.0"}
setuptools = ">=84.2.1,<85.0"
pyclean = "^3.7.0"
pylint = "^4.1.4"
autopep8 = "^2.3.2"
ipykernel = "^7.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
